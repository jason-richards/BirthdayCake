<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cake Body Gradient -->
    <linearGradient id="cakeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF85A1"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>
    <!-- Frosting Gradient -->
    <linearGradient id="frostingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0E6EF"/>
    </linearGradient>
    <!-- Flame Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Plate -->
  <ellipse cx="64" cy="110" rx="52" ry="10" fill="#D8D8D8"/>
  <ellipse cx="64" cy="108" rx="50" ry="9" fill="#EAEAEA"/>

  <!-- Cake Base -->
  <path d="M 24,70 L 24,96 C 24,106 104,106 104,96 L 104,70 Z" fill="url(#cakeGrad)"/>

  <!-- Frosting Dripping Layer -->
  <path d="M 24,70 
           C 24,70 32,78 40,70 
           C 48,62 56,80 64,70 
           C 72,60 80,76 88,70 
           C 96,64 104,70 104,70 
           L 104,52 C 104,44 24,44 24,52 Z" 
        fill="url(#frostingGrad)"/>

  <!-- Candles -->
  <!-- Candle 1 (Left) -->
  <rect x="42" y="30" width="6" height="24" rx="3" fill="#4CC9F0"/>
  <!-- Candle 2 (Center) -->
  <rect x="61" y="24" width="6" height="30" rx="3" fill="#FFB703"/>
  <!-- Candle 3 (Right) -->
  <rect x="80" y="30" width="6" height="24" rx="3" fill="#7209B7"/>

  <!-- Candle Wicks -->
  <line x1="45" y1="30" x2="45" y2="25" stroke="#333" stroke-width="1.5"/>
  <line x1="64" y1="24" x2="64" y2="19" stroke="#333" stroke-width="1.5"/>
  <line x1="83" y1="30" x2="83" y2="25" stroke="#333" stroke-width="1.5"/>

  <!-- Flames -->
  <!-- Flame 1 -->
  <path d="M 45,15 C 41,20 45,25 45,25 C 45,25 49,20 45,15 Z" fill="#FF0000" filter="url(#glow)"/>
  <path d="M 45,18 C 43,21 45,24 45,24 C 45,24 47,21 45,18 Z" fill="#FFCC00"/>

  <!-- Flame 2 -->
  <path d="M 64,9 C 60,14 64,19 64,19 C 64,19 68,14 64,9 Z" fill="#FF0000" filter="url(#glow)"/>
  <path d="M 64,12 C 62,15 64,18 64,18 C 64,18 66,15 64,12 Z" fill="#FFCC00"/>

  <!-- Flame 3 -->
  <path d="M 83,15 C 79,20 83,25 83,25 C 83,25 87,20 83,15 Z" fill="#FF0000" filter="url(#glow)"/>
  <path d="M 83,18 C 81,21 83,24 83,24 C 83,24 85,21 83,18 Z" fill="#FFCC00"/>
</svg>
